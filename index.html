<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>adityaweb.xyz</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
    font-family: 'Segoe UI', system-ui, sans-serif;
    color: #fff;
    overflow: hidden;
  }
  .card {
    text-align: center;
    padding: 40px 60px;
    border: 1px solid #333;
    border-radius: 12px;
    animation: fadeIn 1s ease-out;
  }
  h1 {
    font-size: 1.8rem;
    margin-bottom: 10px;
    letter-spacing: 0.5px;
  }
  .check {
    display: inline-block;
    margin-right: 8px;
    animation: pop 0.6s ease-out 0.3s backwards;
  }
  p {
    font-size: 1rem;
    color: #aaa;
    margin-top: 6px;
  }
  .domain {
    margin-top: 20px;
    font-size: 1.1rem;
    font-weight: 600;
    color: #fff;
    border-top: 1px solid #333;
    padding-top: 16px;
    display: inline-block;
  }
  .domain::after {
    content: '';
    display: block;
    width: 0%;
    height: 2px;
    background: #fff;
    margin: 8px auto 0;
    animation: underline 1.2s ease-out 0.6s forwards;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes pop {
    from { transform: scale(0); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  @keyframes underline {
    to { width: 100%; }
  }
</style>
</head>
<body>
  <div class="card">
    <h1><span class="check">✓</span>Successfully Connected</h1>
    <p>Your domain is live and pointing correctly.</p>
    <div class="domain">adityaweb.xyz</div>
  </div>
</body>
</html>
